name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bc
          POSTGRES_PASSWORD: bc
          POSTGRES_DB: bookmark_captain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bc -d bookmark_captain_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://bc:bc@localhost:5432/bookmark_captain_test
      NEXT_PUBLIC_API_URL: http://localhost:4000
      WEB_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check migrations are up to date with the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/migrations || {
            echo "::error::Schema changed without a migration. Run 'pnpm db:generate' and commit the result."
            exit 1
          }
          test -z "$(git status --porcelain -- packages/db/migrations)"

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bc
          POSTGRES_PASSWORD: bc
          POSTGRES_DB: bookmark_captain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bc -d bookmark_captain_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://bc:bc@localhost:5432/bookmark_captain_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @bc/e2e exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
