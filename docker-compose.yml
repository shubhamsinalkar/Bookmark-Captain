# Local Postgres for development and tests. Production uses Neon.
# pgvector image keeps parity with Neon, which ships the `vector` extension (needed from Phase 3).
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: bc
      POSTGRES_PASSWORD: bc
      POSTGRES_DB: bookmark_captain
    ports:
      # Loopback only: the throwaway credentials above must not be reachable from the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bc -d bookmark_captain']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
